image: python:3.12-slim

variables:
  UV_CACHE_DIR: ".uv-cache"
  FF_USE_FASTZIP: "true"

.uv-cache: &uv-cache
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache
  policy: pull

stages:
  - quality
  - test
  - publish

before_script:
  - pip install uv --quiet
  - uv sync --frozen --all-extras

# ---------------------------------------------------------------------------
# Quality
# ---------------------------------------------------------------------------
lint:
  stage: quality
  cache:
    <<: *uv-cache
  script:
    - uv run ruff check src tests
    - uv run ruff format --check src tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

typecheck:
  stage: quality
  cache:
    <<: *uv-cache
  script:
    - uv run mypy src --config-file=pyproject.toml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

# ---------------------------------------------------------------------------
# Test matrix
# ---------------------------------------------------------------------------
.test-base: &test-base
  stage: test
  cache:
    <<: *uv-cache
  script:
    - uv run pytest --cov=mypkg --cov-report=xml --cov-report=term-missing -n auto
  coverage: '/TOTAL.*\s(\d+)%$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 7 days

test:3.12:
  <<: *test-base
  image: python:3.12-slim

test:3.13:
  <<: *test-base
  image: python:3.13-slim
  artifacts: {}  # only upload coverage from 3.12

# ---------------------------------------------------------------------------
# Publish to PyPI (tag-triggered)
# ---------------------------------------------------------------------------
publish:
  stage: publish
  image: python:3.12-slim
  before_script:
    - pip install uv --quiet
  script:
    - uv build
    - uv publish --token $PYPI_TOKEN
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  environment:
    name: pypi
    url: https://pypi.org/p/mypkg
