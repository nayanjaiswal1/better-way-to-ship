[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "uv"
major_version_zero = true
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
bump_message = "chore: release $new_version"

[tool.commitizen.customize]
schema_pattern = '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?: .{3,72}$'
bump_pattern = '^(feat|fix|perf|revert)'
bump_map = { feat = "MINOR", fix = "PATCH", perf = "PATCH", revert = "PATCH" }
change_type_order = ["feat", "fix", "perf", "refactor", "docs", "build", "ci", "chore"]
change_type_map = { feat = "Features", fix = "Bug Fixes", perf = "Performance", refactor = "Refactoring", docs = "Documentation", build = "Build", ci = "CI", chore = "Chores" }
