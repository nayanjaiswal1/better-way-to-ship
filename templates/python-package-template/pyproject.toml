[project]
name = "mypkg"
version = "0.1.0"
description = "A production-ready Python package"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Author Name", email = "author@example.com" }]
requires-python = ">=3.12"
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "pytest-xdist>=3.6,<4.0",
]

[project.urls]
Homepage = "https://github.com/your-org/mypkg"
Repository = "https://github.com/your-org/mypkg"
Issues = "https://github.com/your-org/mypkg/issues"
Changelog = "https://github.com/your-org/mypkg/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mypkg"]

[tool.hatch.version]
path = "src/mypkg/__init__.py"

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
dev-dependencies = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "pytest-xdist>=3.6,<4.0",
    "ruff>=0.15,<1.0",
    "mypy>=1.14,<2.0",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "C4",          # flake8-comprehensions
    "S",           # flake8-bandit
    "T20",         # flake8-print
    "RUF",         # Ruff-specific
    "ANN",         # flake8-annotations
    "D",           # pydocstyle
    "ERA",         # eradicate
    "SIM",         # flake8-simplify
    "TID",         # flake8-tidy-imports
    "TCH",         # flake8-type-checking
    "PERF",        # perflint
    "FURB",        # refurb (modernise code)
    "LOG",         # flake8-logging
]
ignore = [
    "ANN101",  # self annotation
    "ANN102",  # cls annotation
    "D100",    # missing docstring in public module
    "D104",    # missing docstring in public package
    "S101",    # assert ok in tests
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "D"]

[tool.ruff.lint.isort]
known-first-party = ["mypkg"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
pretty = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
]
markers = [
    "unit: fast unit tests",
    "integration: tests with external dependencies",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["mypkg"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
]
