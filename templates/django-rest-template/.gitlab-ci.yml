image: python:3.12-slim

variables:
  UV_VERSION: "latest"
  UV_SYSTEM_PYTHON: "1"
  UV_CACHE_DIR: ".uv-cache"
  POSTGRES_DB: test_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST_AUTH_METHOD: trust
  FF_USE_FASTZIP: "true"

.uv-cache: &uv-cache
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache
    - .ruff_cache
    - .mypy_cache
  policy: pull

stages:
  - quality
  - test
  - release

# ---------------------------------------------------------------------------
# Install uv before each job
# ---------------------------------------------------------------------------
before_script:
  - pip install uv --quiet
  - uv sync --frozen --all-extras

# ---------------------------------------------------------------------------
# Quality
# ---------------------------------------------------------------------------
lint:
  stage: quality
  interruptible: true
  cache:
    <<: *uv-cache
  script:
    - uv run ruff check src tests
    - uv run ruff format --check src tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "develop"

typecheck:
  stage: quality
  interruptible: true
  cache:
    <<: *uv-cache
  script:
    - uv run mypy src --config-file=pyproject.toml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Security (GitLab built-in)
# ---------------------------------------------------------------------------
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: quality
  variables:
    SAST_EXCLUDED_PATHS: ".venv, .uv-cache"

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------
test:
  stage: test
  interruptible: true
  cache:
    <<: *uv-cache
  services:
    - postgres:17-alpine
  variables:
    DJANGO_SETTINGS_MODULE: config.settings.test
  script:
    - uv run pytest --cov=src --cov-report=xml --cov-report=term-missing --junit-xml=report.xml -n auto
  coverage: '/TOTAL.*\s(\d+)%$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: report.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "develop"

migrations:
  stage: test
  interruptible: true
  cache:
    <<: *uv-cache
  services:
    - postgres:17-alpine
  variables:
    DJANGO_SETTINGS_MODULE: config.settings.test
    SECRET_KEY: ci-secret-key-not-for-production  # pragma: allowlist secret
    DB_NAME: test_db
    DB_USER: postgres
    DB_PASSWORD: postgres
    DB_HOST: postgres
  script:
    - uv run python src/manage.py migrate --check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
