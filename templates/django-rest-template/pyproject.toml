[project]
name = "django-rest-template"
version = "0.1.0"
description = "Production-ready Django REST Framework backend template"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.16,<4.0",
    "django-cors-headers>=4.6,<5.0",
    "django-filter>=24.3,<25.0",
    "drf-spectacular>=0.28,<1.0",
    "python-decouple>=3.8,<4.0",
    "psycopg[binary]>=3.2,<4.0",
    "gunicorn>=23.0,<24.0",
    "whitenoise>=6.8,<7.0",
    "celery>=5.5,<6.0",
    "redis>=5.2,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "pytest-cov>=6.0,<7.0",
    "pytest-xdist>=3.6,<4.0",
    "factory-boy>=3.3,<4.0",
    "faker>=33.0,<34.0",
    "model-bakery>=1.20,<2.0",
    "httpx>=0.28,<1.0",
    "django-stubs[compatible-mypy]>=5.1,<6.0",
    "djangorestframework-stubs[compatible-mypy]>=3.15,<4.0",
    "types-redis>=4.6,<5.0",
    "mypy>=1.14,<2.0",
    "ruff>=0.15,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
dev-dependencies = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "pytest-cov>=6.0,<7.0",
    "pytest-xdist>=3.6,<4.0",
    "factory-boy>=3.3,<4.0",
    "faker>=33.0,<34.0",
    "model-bakery>=1.20,<2.0",
    "httpx>=0.28,<1.0",
    "django-stubs[compatible-mypy]>=5.1,<6.0",
    "djangorestframework-stubs[compatible-mypy]>=3.15,<4.0",
    "types-redis>=4.6,<5.0",
    "mypy>=1.14,<2.0",
    "ruff>=0.15,<1.0",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "C4",          # flake8-comprehensions
    "DJ",          # flake8-django
    "S",           # flake8-bandit (security)
    "T20",         # flake8-print
    "RUF",         # Ruff-specific
    "ANN",         # flake8-annotations
    "ERA",         # eradicate
    "SIM",         # flake8-simplify
    "TID",         # flake8-tidy-imports
    "PERF",        # perflint
    "LOG",         # flake8-logging
    "G",           # flake8-logging-format
]
ignore = [
    "ANN101",  # missing type annotation for self
    "ANN102",  # missing type annotation for cls
    "S101",    # assert usage (ok in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "DJ001"]
"src/config/settings/**" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["api", "config"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
ignore_missing_imports = true
warn_return_any = true
disallow_untyped_decorators = false
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
    "-p", "no:warnings",
]
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests requiring database or external services",
    "slow: tests that are intentionally slow",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "src/config/settings/*",
    "src/manage.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
