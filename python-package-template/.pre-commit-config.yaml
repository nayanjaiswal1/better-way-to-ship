repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        args: ["--config-file=pyproject.toml"]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.28.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # ---------------------------------------------------------------------------
  # Local hook: block AI agent attribution lines in commit messages.
  # Rejects commits whose footer contains Co-Authored-By: Claude/Copilot,
  # "Generated by ...", "🤖 Generated with ...", or similar agent stamps.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: no-agent-detail
        name: No AI agent attribution in commit message
        language: pygrep
        entry: '(?i)(co-authored-by:\s*(claude|copilot|chatgpt|gemini|cursor)|generated\s+(by|with)\s+(claude|copilot|chatgpt|gemini|ai|llm)|via\s+claude\s+code|noreply@anthropic\.com|🤖)'
        args: [--multiline]
        stages: [commit-msg]
        types: [text]
